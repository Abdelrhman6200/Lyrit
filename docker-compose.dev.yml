# Local development database only: `docker compose -f docker-compose.dev.yml up -d`
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: lyrit, POSTGRES_USER: lyrit, POSTGRES_PASSWORD: lyrit }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [devdata:/var/lib/postgresql/data]
volumes:
  devdata:
